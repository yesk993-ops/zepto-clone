<!DOCTYPE html>
<html>
<head>
<title>Zepto Clone</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
 margin:0;
 font-family: Arial, sans-serif;
 background:#f5f5f5;
}

/* Header */
.header{
 background:#6C2BD9;
 color:white;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:22px;
 font-weight:bold;
}

.search{
 width:50%;
}

.search input{
 width:100%;
 padding:8px;
 border-radius:5px;
 border:none;
}

/* Products */
.container{
 padding:20px;
 display:flex;
 flex-wrap:wrap;
 gap:15px;
}

.card{
 background:white;
 padding:15px;
 border-radius:10px;
 width:180px;
 box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
 width:100%;
}

button{
 background:#6C2BD9;
 color:white;
 border:none;
 padding:8px;
 border-radius:5px;
 cursor:pointer;
}

button:hover{
 opacity:0.9;
}

</style>
</head>

<body>

<div class="header">
  <div class="logo">⚡ Zepto Clone</div>
  <div class="search">
    <input placeholder="Search for groceries..." />
  </div>
  <div>🛒 Cart</div>
</div>

<div class="container" id="product-list"></div>

<script>

const products = [
 {id:1,name:"Milk",img:"https://via.placeholder.com/150"},
 {id:2,name:"Bread",img:"https://via.placeholder.com/150"},
 {id:3,name:"Eggs",img:"https://via.placeholder.com/150"},
 {id:4,name:"Banana",img:"https://via.placeholder.com/150"}
];

const container = document.getElementById("product-list");

products.forEach(p=>{
 const card = document.createElement("div");
 card.className="card";

 card.innerHTML = `
   <img src="${p.img}">
   <h3>${p.name}</h3>
   <button onclick="addToCart(${p.id})">Add to Cart</button>
 `;

 container.appendChild(card);
});

function addToCart(id){
 alert("Added product "+id+" to cart");
}

</script>

</body>
</html>
