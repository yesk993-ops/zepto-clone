apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
      - name: cart-service
        image: mydocker3692/cart
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080


---
apiVersion: v1
kind: Service
metadata:
  name: cart
spec:
  type: NodePort
  selector:
    app: cart-service
  ports:
  - port: 80
    targetPort: 3000
